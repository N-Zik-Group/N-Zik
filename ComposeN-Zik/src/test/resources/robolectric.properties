# Robolectric instantiates the application declared in AndroidManifest.xml (MainApplication)
# once Android resources are available to unit tests (includeAndroidResources). Its onCreate()
# touches androidx.security.crypto (AndroidKeyStore), which does not exist on the JVM. The
# database and worker tests only need a bare application.
application=android.app.Application

# Robolectric installs Conscrypt as a JVM-wide security provider by default; once a Robolectric
# test has run, javax.crypto (HMAC) breaks for the plain JVM tests that follow in the same
# process (the PC bridge pairing and audio-token tests). The app's tests never need Conscrypt.
conscryptMode=OFF
