name: Retrieve Keystore (TEMP)

on:
  workflow_dispatch:

jobs:
  extract-keystore:
    runs-on: ubuntu-latest
    environment: keystore-retrieval
    steps:
      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > release.keystore

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-keystore
          path: release.keystore
          retention-days: 1

      # TEMP one-time read: recover Last.fm API key/secret values for the
      # F-Droid build fix. Values are base64-encoded because GitHub redacts
      # raw secret values in logs. Delete this step (and the workflow) after use.
      - name: Show Last.fm API secrets (TEMP - one-time read)
        run: |
          echo "LASTFM_API_KEY_B64=$(printf '%s' "${{ secrets.LASTFM_API_KEY }}" | base64 -w0)"
          echo "LASTFM_API_SECRET_B64=$(printf '%s' "${{ secrets.LASTFM_API_SECRET }}" | base64 -w0)"
          echo "LASTFM_API_KEY_B64=$(printf '%s' "${{ secrets.LASTFM_API_KEY }}" | base64 -w0)" >> "$GITHUB_STEP_SUMMARY"
          echo "LASTFM_API_SECRET_B64=$(printf '%s' "${{ secrets.LASTFM_API_SECRET }}" | base64 -w0)" >> "$GITHUB_STEP_SUMMARY"
