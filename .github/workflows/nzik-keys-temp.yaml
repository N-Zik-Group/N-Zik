name: Retrieve Keystore (TEMP)

on:
  workflow_dispatch:

jobs:
  extract-keystore:
    runs-on: ubuntu-latest
    environment: keystore-retrieval
    steps:
      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > release.keystore

      # TEMP one-time read: recover Last.fm API key/secret values for the
      # F-Droid build fix, delivered in the same protected artifact as the
      # keystore (values must not appear in public logs).
      # Delete these TEMP steps (and the workflow) after use.
      - name: Write Last.fm secrets to file (TEMP)
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_API_SECRET=${{ secrets.LASTFM_API_SECRET }}"
          } > lastfm-secrets.txt

      - name: Upload keystore + Last.fm secrets artifact
        uses: actions/upload-artifact@v7
        with:
          name: retrieved-keys
          path: |
            release.keystore
            lastfm-secrets.txt
          retention-days: 1
