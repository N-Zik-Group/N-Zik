name: Update Project Stats and Chart

env:
  TZ: Europe/Paris

on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Fetch Data and Update History
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Fetch general repo data
          REPO_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/N-Zik-Group/N-Zik")
          FORKS=$(echo "$REPO_DATA" | jq '.forks_count')

          # 2. Fetch the latest stable release
          LATEST_DATA=$(curl -fsS -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/N-Zik-Group/N-Zik/releases/latest")
          LATEST_VERSION=$(echo "$LATEST_DATA" | jq -r '.tag_name // "None"')
          RELEASE_SUBTITLE=""
          RELEASE_DOWNLOADS_Y=105
          if [[ "$LATEST_VERSION" == *-* ]]; then
            SUFFIX=${LATEST_VERSION#*-}
            LATEST_VERSION=${LATEST_VERSION%%-*}
            SUFFIX_FIT=""
            if [ "${#SUFFIX}" -gt 20 ]; then
              SUFFIX_FIT='textLength="160" lengthAdjust="spacingAndGlyphs"'
            fi
            SUFFIX=$(printf '%s' "$SUFFIX" | jq -sRr '@html')
            RELEASE_SUBTITLE="<text text-anchor=\"middle\" x=\"320\" y=\"102\" class=\"text-release-suffix\" $SUFFIX_FIT>$SUFFIX</text>"
            RELEASE_DOWNLOADS_Y=120
          fi
          RELEASE_FIT=""
          if [ "${#LATEST_VERSION}" -gt 14 ]; then
            RELEASE_FIT='textLength="160" lengthAdjust="spacingAndGlyphs"'
          fi
          LATEST_VERSION=$(printf '%s' "$LATEST_VERSION" | jq -sRr '@html')
          LATEST_DOWNLOADS=$(echo "$LATEST_DATA" | jq '[.assets[].download_count] | add // 0')

          # 3. Fetch total downloads across all releases (handling pagination)
          TOTAL_DOWNLOADS=0
          PAGE=1
          : > "$RUNNER_TEMP/metrics-releases.jsonl"
          while true; do
            PAGE_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/N-Zik-Group/N-Zik/releases?per_page=100&page=$PAGE")
            COUNT=$(echo "$PAGE_DATA" | jq 'length')
            if [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; then
              break
            fi
            DL=$(echo "$PAGE_DATA" | jq '[.[].assets[].download_count] | add // 0')
            echo "$PAGE_DATA" | jq -c '.[] | select(.draft == false and .prerelease == false and .published_at != null) | {tag_name, published_at}' >> "$RUNNER_TEMP/metrics-releases.jsonl"
            TOTAL_DOWNLOADS=$((TOTAL_DOWNLOADS + DL))
            PAGE=$((PAGE + 1))
          done

          # Format numbers for the card
          format_number() {
            local num=$1
            if [ "$num" -ge 1000000 ]; then echo "$(echo "scale=1; $num/1000000" | bc)M";
            elif [ "$num" -ge 1000 ]; then echo "$(echo "scale=1; $num/1000" | bc)k";
            else echo "$num";
            fi
          }

          TOTAL_FMT=$(format_number $TOTAL_DOWNLOADS)
          LATEST_FMT=$(format_number $LATEST_DOWNLOADS)
          FORKS_FMT=$(format_number $FORKS)

          # 4. History management (assets/stats/history.json)
          mkdir -p assets/stats
          [ -f assets/stats/history.json ] || echo '[]' > assets/stats/history.json
          LAST_SAVED=$(jq '.[-1].downloads // empty' assets/stats/history.json)

          # Save a new data point ONLY if the number changed since last time
          if [ "$LAST_SAVED" != "$TOTAL_DOWNLOADS" ]; then
            TIMESTAMP=$(date +"%Y-%m-%d %H:%M")
            jq --arg time "$TIMESTAMP" --argjson dl "$TOTAL_DOWNLOADS" '. += [{"time": $time, "downloads": $dl}]' assets/stats/history.json > tmp.json && mv tmp.json assets/stats/history.json
          fi

          # 5. Generate the main stats card (always refreshed for safety)
          cat > assets/stats/download-card.svg << EOF
          <svg width="600" height="136" viewBox="0 0 600 136" xmlns="http://www.w3.org/2000/svg">
            <style>
              .bg { fill: #ffffff; stroke: #e1e4e8; }
              .text-title { fill: #2b3137; font-weight: 600; font-size: 15px; }
              .text-label { fill: #586069; font-weight: 500; font-size: 11px; }
              .text-value-1 { fill: #0366d6; font-weight: 700; font-size: 26px; }
              .text-value-2 { fill: #6f42c1; font-weight: 700; font-size: 18px; }
              .text-sub { fill: #28a745; font-weight: 600; font-size: 13px; }
              .text-release-suffix { fill: #6f42c1; font-weight: 600; font-size: 13px; }
              .text-forks { fill: #586069; font-weight: 700; font-size: 18px; }
              .line { stroke: #e1e4e8; }
              
              /* Dark Mode */
              @media (prefers-color-scheme: dark) {
                .bg { fill: #0d1117; stroke: #30363d; }
                .text-title { fill: #c9d1d9; }
                .text-label { fill: #8b949e; }
                .text-value-1 { fill: #58a6ff; }
                .text-value-2 { fill: #d2a8ff; }
                .text-sub { fill: #3fb950; }
                .text-release-suffix { fill: #d2a8ff; }
                .text-forks { fill: #c9d1d9; }
                .line { stroke: #30363d; }
              }
              
              /* Animations */
              @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
              }
              .animated { animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
              .delay-1 { animation-delay: 0.1s; }
              .delay-2 { animation-delay: 0.2s; }
              .delay-3 { animation-delay: 0.3s; }
            </style>
            <defs>
              <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.05" />
              </filter>
            </defs>
            <rect class="bg" width="600" height="136" rx="10" filter="url(#shadow)" stroke-width="1"/>
            
            <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
              <text x="25" y="30" class="text-title animated">📊 N-Zik Project Stats</text>
              
              <!-- Column 1 -->
              <g class="animated delay-1">
                <text text-anchor="middle" x="110" y="65" class="text-label">TOTAL DOWNLOADS</text>
                <text text-anchor="middle" x="110" y="95" class="text-value-1">${TOTAL_FMT}</text>
              </g>

              <line x1="220" y1="45" x2="220" y2="115" class="line" stroke-width="1" />
              
              <!-- Column 2 -->
              <g class="animated delay-2">
                <text text-anchor="middle" x="320" y="65" class="text-label">LATEST RELEASE</text>
                <text text-anchor="middle" x="320" y="85" class="text-value-2" ${RELEASE_FIT}>${LATEST_VERSION}</text>
                ${RELEASE_SUBTITLE}<text text-anchor="middle" x="320" y="${RELEASE_DOWNLOADS_Y}" class="text-sub">${LATEST_FMT} downloads</text>
              </g>

              <line x1="420" y1="45" x2="420" y2="115" class="line" stroke-width="1" />
              
              <!-- Column 3 -->
              <g class="animated delay-3">
                <text text-anchor="middle" x="510" y="65" class="text-label">FORKS</text>
                <text text-anchor="middle" x="510" y="91" class="text-forks">${FORKS_FMT}</text>
              </g>
            </g>
          </svg>
          EOF

      - name: Generate Growth Charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > plot_chart.py << 'PYEOF'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from html import escape
          from zoneinfo import ZoneInfo
          from pathlib import Path
          from urllib.request import Request, urlopen

          def star_history():
              url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/stargazers?per_page=100"
              headers = {"Accept": "application/vnd.github.star+json"}
              if token := os.environ.get("GITHUB_TOKEN"):
                  headers["Authorization"] = f"Bearer {token}"
              stars = {}
              while url:
                  with urlopen(Request(url, headers=headers), timeout=30) as response:
                      for star in json.load(response):
                          stars[star["user"]["id"]] = datetime.fromisoformat(star["starred_at"])
                      url = next(
                          (link.split(";", 1)[0].strip()[1:-1]
                           for link in response.headers.get("Link", "").split(",")
                           if 'rel="next"' in link),
                          None,
                      )
              return [(time.timestamp(), total)
                      for total, time in enumerate(sorted(stars.values()), 1)] or [(releases[-1][0] if releases else datetime.now(timezone.utc).timestamp(), 0)]

          def render_chart(data, title, filename, unit):
              width, height, padding = 600, 200, 72
              chart_w = width - padding - 32
              top, bottom = 86, 170
              chart_h = bottom - top

              times, values = zip(*data)
              min_v, max_v = min(values), max(values)
              range_v = max_v - min_v or 1

              min_t, max_t = min(times), max(times)
              if releases:
                  max_t = max(max_t, releases[-1][0])
              range_t = max_t - min_t or 1

              def time_x(timestamp):
                  return padding + (timestamp - min_t) / range_t * chart_w

              start = datetime.fromtimestamp(min_t, timezone.utc)
              end = datetime.fromtimestamp(max_t, timezone.utc)
              dates = []
              if end - start >= timedelta(days=60):
                  first_month = start.year * 12 + start.month - 1
                  last_month = end.year * 12 + end.month - 1
                  step = max(1, (last_month - first_month + 6) // 6)
                  for month in range(first_month, last_month + 1):
                      year, month_index = divmod(month, 12)
                      if month_index % step:
                          continue
                      tick = datetime(year, month_index + 1, 1, tzinfo=timezone.utc)
                      if start <= tick <= end:
                          label = str(year) if month_index == 0 else tick.strftime("%b")
                          dates.append((time_x(tick.timestamp()), label))
              else:
                  day = start.replace(hour=0, minute=0, second=0, microsecond=0)
                  day -= timedelta(days=day.weekday())
                  step = timedelta(days=14 if (end - start).days >= 35 else 7)
                  while day <= end:
                      if day >= start:
                          dates.append((time_x(day.timestamp()), day.strftime("%d %b")))
                      day += step
                  if not dates:
                      dates.append((time_x(min_t), start.strftime("%d %b %y")))
              date_labels = "".join(
                  f'<text x="{x:.1f}" y="188" text-anchor="middle">{label}</text>'
                  for x, label in dates
              )

              markers = []
              previous_x = width
              for timestamp, tag in reversed(releases):
                  if not min_t <= timestamp <= max_t:
                      continue
                  x = time_x(timestamp)
                  if previous_x - x < 19:
                      continue
                  previous_x = x
                  label = escape(tag if len(tag) <= 10 else tag[:9] + "…")
                  markers.append(
                      f'<g><title>{escape(tag)}</title>'
                      f'<line x1="{x:.1f}" x2="{x:.1f}" y1="40" y2="{bottom}" class="release-line"/>'
                      f'<text transform="translate({x + 4:.1f} 42) rotate(90)">{label}</text></g>'
                  )
              release_markers = "".join(markers)

              points = []
              for t, value in data:
                  x = time_x(t)
                  y = bottom - ((value - min_v) / range_v) * chart_h
                  points.append((x, y))

              # Smooth Bezier Path Generation
              def get_bezier_path(pts):
                  if len(pts) < 2:
                      return f"M {pts[0][0]},{pts[0][1]}"
                  path = [f"M {pts[0][0]},{pts[0][1]}"]
                  for i in range(len(pts) - 1):
                      x0, y0 = pts[i]
                      x1, y1 = pts[i+1]
                      cx = (x0 + x1) / 2
                      path.append(f"C {cx},{y0} {cx},{y1} {x1},{y1}")
                  return " ".join(path)

              path_d = get_bezier_path(points)
              polygon_d = f"{path_d} L {points[-1][0]},{bottom} L {points[0][0]},{bottom} Z"

              def fmt(n):
                  if n >= 1000000: return f"{n/1000000:.1f}M"
                  if n >= 1000: return f"{n/1000:.1f}k"
                  return str(n)

              levels = sorted({round(min_v + (max_v - min_v) * i / 4) for i in range(5)})
              value_labels = "".join(
                  f'<text x="64" y="{bottom - (value - min_v) / range_v * chart_h + 3:.1f}" '
                  f'text-anchor="end">{fmt(value)}</text>'
                  for value in levels
              )

              svg = f'''<svg width="750" height="250" viewBox="0 0 {width} {height}" xmlns="http://www.w3.org/2000/svg">
                <style>
                  .bg {{ fill: #ffffff; stroke: #e1e4e8; }}
                  .text-title {{ fill: #2b3137; font-weight: 600; font-size: 15px; }}
                  .axis-label {{ fill: #586069; font-size: 10px; }}
                  .release-line {{ stroke: #8b949e; stroke-dasharray: 3 3; opacity: 0.55; }}
                  .chart-line {{ stroke: #0366d6; fill: none; }}
                  .chart-dot {{ fill: #ffffff; stroke: #0366d6; }}
                  .grad-start {{ stop-color: #0366d6; stop-opacity: 0.4; }}
                  .grad-end {{ stop-color: #0366d6; stop-opacity: 0.0; }}

                  @media (prefers-color-scheme: dark) {{
                    .bg {{ fill: #0d1117; stroke: #30363d; }}
                    .text-title {{ fill: #c9d1d9; }}
                    .axis-label {{ fill: #a5adba; }}
                    .chart-line {{ stroke: #58a6ff; }}
                    .chart-dot {{ fill: #0d1117; stroke: #58a6ff; }}
                    .grad-start {{ stop-color: #58a6ff; stop-opacity: 0.3; }}
                    .grad-end {{ stop-color: #58a6ff; stop-opacity: 0.0; }}
                  }}

                  @keyframes pulse {{
                    0% {{ r: 4; stroke-width: 2.5; }}
                    50% {{ r: 5.5; stroke-width: 4; stroke-opacity: 0.6; }}
                    100% {{ r: 4; stroke-width: 2.5; }}
                  }}
                  .dot-pulse {{ animation: pulse 2s infinite; }}
                  @keyframes draw {{
                    from {{ stroke-dashoffset: 1000; }}
                    to {{ stroke-dashoffset: 0; }}
                  }}
                  .animated-line {{
                    stroke-dasharray: 1000;
                    stroke-dashoffset: 1000;
                    animation: draw 1.5s ease-out forwards;
                  }}
                </style>
                <defs>
                  <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
                    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.05" />
                  </filter>
                  <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" class="grad-start"/>
                    <stop offset="100%" class="grad-end"/>
                  </linearGradient>
                </defs>
                <rect class="bg" width="{width}" height="{height}" rx="10" filter="url(#shadow2)" stroke-width="1"/>
                <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
                  <text x="25" y="30" class="text-title">{title} (Current: {fmt(values[-1])})</text>
                </g>

                <!-- Area under the line -->
                <path fill="url(#fillGrad)" d="{polygon_d}" />

                <g class="axis-label" font-family="Arial,sans-serif">
                  <text transform="translate(19 128) rotate(-90)" text-anchor="middle">{unit}</text>
                  {value_labels}
                  {date_labels}
                  {release_markers}
                </g>

                <!-- Main curve -->
                <path d="{path_d}" class="chart-line animated-line" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

                <!-- Bright endpoint dot -->
                <circle cx="{points[-1][0]:.1f}" cy="{points[-1][1]:.1f}" r="4" class="chart-dot dot-pulse" stroke-width="2.5" />
              </svg>'''

              Path('assets/stats', filename).write_text(svg, encoding='utf-8')

          release_file = Path(os.environ["RUNNER_TEMP"], "metrics-releases.jsonl")
          release_data = [json.loads(line) for line in release_file.read_text(encoding="utf-8").splitlines()]
          releases = sorted((datetime.fromisoformat(item["published_at"]).timestamp(), item["tag_name"])
                            for item in release_data)
          downloads = json.loads(Path("assets/stats/history.json").read_text(encoding="utf-8"))
          history_zone = ZoneInfo("Europe/Paris")
          render_chart(
              [(datetime.strptime(point["time"], "%Y-%m-%d %H:%M").replace(tzinfo=history_zone).timestamp(),
                point["downloads"]) for point in downloads],
              "📈 Download Growth", "chart.svg", "Downloads",
          )
          render_chart(star_history(), "⭐ Star Growth", "star-chart.svg", "GitHub Stars")
          PYEOF

          python3 plot_chart.py

      - name: Commit and Push Updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update stats and chart [skip ci]"
          file_pattern: assets/stats/download-card.svg assets/stats/chart.svg assets/stats/star-chart.svg assets/stats/history.json
