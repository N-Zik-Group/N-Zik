name: Build Beta

env:
  TZ: Europe/Paris

on:
  workflow_dispatch:

concurrency:
  group: 'beta-deploy'
  cancel-in-progress: false

jobs:
  build_time:
    name: Capture current time
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

  versioning:
    name: Extract version
    runs-on: ubuntu-latest
    outputs:
      downstream: ${{ steps.downstream.outputs.version }}
      code: ${{ steps.downstream.outputs.code }}
      upstream: ${{ steps.upstream.outputs.version }}
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Get downstream (local) version
        id: downstream
        run: |
          echo "Contents of build.gradle.kts:"
          cat ComposeN-Zik/build.gradle.kts

          versionCode=$(grep -E '^\s*nzikVersionCode\s*=' gradle/libs.versions.toml | sed 's/[^0-9]*//g')
          versionName=$(grep -E '^\s*nzikVersionName\s*=' gradle/libs.versions.toml | sed -E 's/.*"(.+)".*/\1/')

          echo "version=$versionName" >> $GITHUB_OUTPUT
          echo "code=$versionCode" >> $GITHUB_OUTPUT

      - name: Get upstream version
        id: upstream
        run: |
          tag_name="$(curl -s https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest | jq -r .tag_name)"
          echo "version=${tag_name#v}" >> $GITHUB_OUTPUT

  verify-version:
    needs: [versioning]
    name: Verify versions
    runs-on: ubuntu-latest
    steps:
      - name: Check if build can proceed
        run: |
          if [ "${{ needs.versioning.outputs.downstream }}" = "${{ needs.versioning.outputs.upstream }}" ]; then
            echo "Versions are equal. Skipping build."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check if changelog exists
        run: |
          if [ ! -f "Updater/changelogs/${{ needs.versioning.outputs.code }}.txt" ]; then
            echo "Changelog not found. Exiting."
            exit 1
          fi

  build-beta:
    needs: [versioning, verify-version]
    name: Build Full Beta
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Copy changelogs into res/raw
        run: cp "Updater/changelogs/${{ needs.versioning.outputs.code }}.txt" "ComposeN-Zik/src/androidMain/res/raw/release_notes.txt"

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Restore Gradle dependencies & build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./build
            ./ComposeN-Zik/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build with Gradle
        run: ./gradlew assembleBeta

      - name: Upload artifacts for signing
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-beta
          path: ComposeN-Zik/build/outputs/apk/beta/*.apk

  build-beta32:
    needs: [versioning, verify-version]
    name: Build Beta32
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Copy changelogs into res/raw
        run: cp "Updater/changelogs/${{ needs.versioning.outputs.code }}.txt" "ComposeN-Zik/src/androidMain/res/raw/release_notes.txt"

      - name: Setup Java 21
        uses: actions/setup-java@v6.0.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Restore Gradle dependencies & build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./build
            ./ComposeN-Zik/build
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build with Gradle
        run: ./gradlew assembleBeta32

      - name: Upload artifacts for signing
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-beta32
          path: ComposeN-Zik/build/outputs/apk/beta32/*.apk

  sign-apks:
    name: Sign APK
    needs: [build-beta, build-beta32]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: upstream/unsigned
          merge-multiple: true

      - name: Sign APK
        uses: Tlaster/android-sign@v1.2.2
        with:
          releaseDirectory: upstream/unsigned
          signingKeyBase64: '${{ secrets.RELEASE_KEYSTORE }}'
          keyStorePassword: '${{ secrets.RELEASE_KEYSTORE_PASSWD }}'
          alias: '${{ secrets.RELEASE_KEY_ALIAS }}'
          keyPassword: '${{ secrets.RELEASE_KEY_PASSWD }}'
          output: signed
        env:
          BUILD_TOOLS_VERSION: '34.0.0'

      - name: Remove trails
        run: |
          for filename in signed/*.apk; do mv "$filename" "${filename//-signed}"; done

      - name: Upload for release
        uses: actions/upload-artifact@v7
        with:
          name: signed-apk
          path: signed/*.apk

  upload-to-release:
    needs: [build_time, versioning, sign-apks]
    runs-on: ubuntu-latest
    permissions:
      contents: write  
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v8.0.1
        with:
          name: signed-apk
      - name: Upload built APK to pre-release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.apk'
          name: v${{ needs.versioning.outputs.downstream }}-beta-${{ needs.build_time.outputs.date }} | 🚀 BETA Build
          tag_name: v${{ needs.versioning.outputs.downstream }}-beta
          prerelease: true
          make_latest: false
          body: |
            ## ⚠️ Beta Release v${{ needs.versioning.outputs.downstream }}-beta
            ---
            <div align="center">
              <img alt="N-Zik Logo" src="https://github.com/N-Zik-Group/N-Zik/blob/main/assets/design/ic_banner2.png?raw=true" width="1000" />
              <p><b>N-Zik</b> - by @N-Zik-Group</p>
              <p><i>This is a <b>BETA build</b>, intended for testing only.</i></p>
            </div>

            ## 🔎 Verification

            > Always verify the signature before installing any APK downloaded from GitHub or other distributors.

            ### Public key hashes

            | Algorithm | Hash digest                                                        |
            |-----------|--------------------------------------------------------------------|
            | SHA-256   | 504cdeb65e52070f0515f9ad295a288a4894d0924e9ef5d6080fdea5bdf841d6 |
            | SHA-1     | 16e766c566e511c7d83f40e30850be27b7040a43                         |
            | MD5       | 16e2bdf083316967c6a2dd5a0391bb76                                 |

            ### Certificate hashes

            | Algorithm | Hash digest                                                        |
            |-----------|--------------------------------------------------------------------|
            | SHA-256   | b473991ec08a17996a9ef2405934ce35d333ea38135ebfc1b6f4d2ab953132aa |
            | SHA-1     | ec57f7d61cf2382aecff7444e815e37a601cb1f1                         |
            | MD5       | 5ae0045983899ab7ca5db38ef785d6ab                                 |

            ## 📲 Installation

            ⚠️ This is a **BETA release**, not a stable version.  
            It is intended **only for testing and feedback**.

            1. Download the **Full BETA build** below.  
            2. Verify its signature using the hashes provided.  
            3. Install on your device (you may need to allow installation from outside the Play Store).  

            Please report any crashes, bugs, or unexpected behavior.

            ## 📦 Available Build

            - **Full (BETA)** – Complete build with all components (`arm64-v8a`, 64-bit only).  
            - **Beta32** – Complete build without FFmpeg (`armeabi-v7a` + `arm64-v8a`, 32-bit & 64-bit).  
              ⚠️ May contain bugs or experimental features.

            ## 🔄 Update Policy

            - 🟡 **Beta & Beta32 Builds (-b / -b32)**
              - **Default:** Update notifications for **Beta** are **enabled by default**.  
              - **User options:**  
                - You can **disable Beta updates** in **Settings > About > Beta update disabled**.  
                - You can **enable or disable auto update** in **Settings > About > Auto update enabled**.  
              - **Behavior:**  
                - Without Beta enabled → automatically upgrades to the latest **Stable** release.  
                - With Beta enabled → stays on the **Beta channel** and receives **Stable updates** as well.  
              - ⚠️ **Note:** This build may contain experimental features and bugs. Only enable Beta updates if you want to test new features.

            This lets you decide whether to test new experimental updates or stick with the stable ones.

            ## 🔗 Changelog & Downloads

            - Full changelog: [Compare v${{ needs.versioning.outputs.upstream }}...v${{ needs.versioning.outputs.downstream }}](https://github.com/N-Zik-Group/N-Zik/compare/v${{ needs.versioning.outputs.upstream }}...v${{ needs.versioning.outputs.downstream }})  
            - [Changelog text file](https://github.com/N-Zik-Group/N-Zik/blob/main/Updater/changelogs/${{ needs.versioning.outputs.code }}.txt)

          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true

  comment-beta-issues:
    needs: [upload-to-release, versioning]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment issues marked as "patched BETA" and remove label
        uses: actions/github-script@v9
        with:
          script: |
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'patched BETA',
              per_page: 100,
            });

            const version = '${{ needs.versioning.outputs.downstream }}-beta';
            const body = [
              `🧪 This issue is fixed in the **BETA** build **v${version}** 🧪`,
              `➤ Download: https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/v${version}`,
              '',
              '> This is a beta release, the ticket stays open until the stable version confirms the fix.'
            ].join('\n');

            for (const issue of issues) {
              if (issue.pull_request) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: 'patched BETA'
              });
              
              console.log(`Commented on issue #${issue.number} and removed label`);
            }

  notify-discord:
    needs: [upload-to-release, versioning]
    runs-on: ubuntu-latest
    steps:
      - name: 🧪 Beta Release Notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONTENT: |
            ⚠️ **||<@&1345079801324634195>|| BETA VERSION v${{ needs.versioning.outputs.downstream }}-b AVAILABLE!**

            🧪 Help us test the latest features!
          DESCRIPTION: |
            ## 📲 Installation

            ⚠️ This is a **BETA release**, not a stable version.  
            It is intended **only for testing and feedback**.

            1. Download the **Full BETA build** below.  
            2. Verify its signature using the hashes provided.  
            3. Install on your device (you may need to allow installation from outside the Play Store).  

            Please report any crashes, bugs, or unexpected behavior.

            ## 📦 Available Build

            - **Full (BETA)** – Complete build with all components (`arm64-v8a`, 64-bit only).  
            - **Beta32** – Complete build without FFmpeg (`armeabi-v7a` + `arm64-v8a`, 32-bit & 64-bit).  
              ⚠️ May contain bugs or experimental features.

            ## 🔄 Update Policy

            - 🟡 **Beta & Beta32 Builds (-b / -b32)** - **Default:** Update notifications for **Beta** are **enabled by default**.  
              - **User options:** - You can **disable Beta updates** in **Settings > About > Beta update disabled**.  
                - You can **enable or disable auto update** in **Settings > About > Auto update enabled**.  
              - **Behavior:** - Without Beta enabled → automatically upgrades to the latest **Stable** release.  
                - With Beta enabled → stays on the **Beta channel** and receives **Stable updates** as well.  
              - ⚠️ **Note:** This build may contain experimental features and bugs. Only enable Beta updates if you want to test new features.

            This lets you decide whether to test new experimental updates or stick with the stable ones.

            ## 🔗 Changelog & Downloads

            - 📥 **Full BETA APK:** https://github.com/${{ github.repository }}/releases/download/v${{ needs.versioning.outputs.downstream }}-beta/N-Zik-beta.apk
            - 📥 **Beta32 APK:** https://github.com/${{ github.repository }}/releases/download/v${{ needs.versioning.outputs.downstream }}-beta/N-Zik-beta32.apk
            - 📄 **Changelog:** <https://github.com/N-Zik-Group/N-Zik/blob/main/Updater/changelogs/${{ needs.versioning.outputs.code }}.txt>
            - 🚀 **Release page:** <https://github.com/${{ github.repository }}/releases/tag/v${{ needs.versioning.outputs.downstream }}-beta>
        run: |
          jq -n \
            --arg content "$CONTENT" \
            --arg username "N-Zik Beta" \
            --arg avatar "https://raw.githubusercontent.com/N-Zik-Group/N-Zik/main/assets/discord/fallback_app.png" \
            --arg desc "$DESCRIPTION" \
            '{
              content: $content,
              username: $username,
              avatar_url: $avatar,
              embeds: [{
                color: 16711680,
                description: $desc,
                footer: {
                  text: "N-Zik BETA • Testing & Feedback Needed",
                  icon_url: $avatar
                }
              }]
            }' > payload.json

          curl -X POST -H "Content-Type: application/json" -d @payload.json $WEBHOOK_URL
