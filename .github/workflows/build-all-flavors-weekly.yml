name: Build Stable Flavors

env:
  TZ: Europe/Paris

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at 0AM
  workflow_dispatch:

concurrency:
  group: 'weekly-deploy'
  cancel-in-progress: false

jobs:
  build_time:
    name: Capture current time
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

  versioning:
    name: Extract version
    runs-on: ubuntu-latest
    outputs:
      downstream: ${{ steps.downstream.outputs.version }}
      code: ${{ steps.downstream.outputs.code }}
      upstream: ${{ steps.upstream.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Capture canonical source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Get downstream (local) version
        id: downstream
        run: |
          echo "version=$(grep -E '^\s*nzikVersionName\s*=' gradle/libs.versions.toml | awk -F '\"' '{print $2}')" >> $GITHUB_OUTPUT
          echo "code=$(grep -E '^\s*nzikVersionCode\s*=' gradle/libs.versions.toml | awk -F '\"' '{print $2}')" >> $GITHUB_OUTPUT
      - name: Get upstream version
        id: upstream
        run: |
          tag_name="$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)"
          echo "version=${tag_name#v}" >> $GITHUB_OUTPUT

  verify-version:
    needs: [versioning]
    name: Verify versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versioning.outputs.sha }}
          submodules: true

      - name: Check if version changed
        run: |
          if [ "${{ needs.versioning.outputs.downstream }}" = "${{ needs.versioning.outputs.upstream }}" ]; then
            echo "Versions are equal. Skipping build."
            exit 1
          fi

      - name: Check if changelog exists
        run: |
          if [ ! -f "Updater/changelogs/${{ needs.versioning.outputs.code }}.txt" ]; then
            echo "Changelog not found. Exiting."
            exit 1
          fi

      - name: Check if Beta release exists
        run: |
          repo="${GITHUB_REPOSITORY}"
          beta_tag="${{ needs.versioning.outputs.downstream }}-beta"

          echo "Checking if beta $beta_tag already exists..."
          beta_exists=$(curl -s "https://api.github.com/repos/$repo/releases" \
            | jq -r '.[] | select(.prerelease==true) | .tag_name | ltrimstr("v")' \
            | grep "$beta_tag" || true)

          if [ -n "$beta_exists" ]; then
            echo "Beta $beta_tag already exists. Skipping build."
            exit 1
          fi

      - name: Check if Dev release exists
        run: |
          repo="${GITHUB_REPOSITORY}"
          dev_tag="${{ needs.versioning.outputs.downstream }}-dev"

          echo "Checking if dev $dev_tag already exists..."
          dev_exists=$(curl -s "https://api.github.com/repos/$repo/releases" \
            | jq -r '.[] | select(.prerelease==true) | .tag_name | ltrimstr("v")' \
            | grep "$dev_tag" || true)

          if [ -n "$dev_exists" ]; then
            echo "Dev $dev_tag already exists. Skipping build."
            exit 1
          fi

  build-release64:
    needs: [versioning, verify-version]
    name: Build release64 version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versioning.outputs.sha }}
          submodules: true

      - name: Copy changelogs into res/raw
        run: cp "Updater/changelogs/${{ needs.versioning.outputs.code }}.txt" "ComposeN-Zik/src/androidMain/res/raw/release_notes.txt"

      - name: Setup Java 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Restore Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-dependencies-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-dependencies-${{ runner.os }}-

      - name: Build with Gradle
        run: ./gradlew assembleRelease64 --no-build-cache

      - name: Verify APK source revision and native ABIs
        env:
          SOURCE_SHA: ${{ needs.versioning.outputs.sha }}
        run: python3 .github/scripts/verify_release.py apk --sha "$SOURCE_SHA" --variant release64 --directory ComposeN-Zik/build/outputs/apk/release64

      - name: Upload artifacts for signing
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-release64
          path: ComposeN-Zik/build/outputs/apk/release64/*.apk

  build-release32:
    needs: [versioning, verify-version]
    name: Build release32 version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versioning.outputs.sha }}
          submodules: true

      - name: Copy changelogs into res/raw
        run: cp "Updater/changelogs/${{ needs.versioning.outputs.code }}.txt" "ComposeN-Zik/src/androidMain/res/raw/release_notes.txt"

      - name: Setup Java 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Restore Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-dependencies-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-dependencies-${{ runner.os }}-

      - name: Build with Gradle
        run: ./gradlew assembleRelease32 --no-build-cache

      - name: Verify APK source revision and native ABIs
        env:
          SOURCE_SHA: ${{ needs.versioning.outputs.sha }}
        run: python3 .github/scripts/verify_release.py apk --sha "$SOURCE_SHA" --variant release32 --directory ComposeN-Zik/build/outputs/apk/release32

      - name: Upload artifacts for signing
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-release32
          path: ComposeN-Zik/build/outputs/apk/release32/*.apk

  build-minified64:
    needs: [versioning, verify-version]
    name: Build minified64 version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versioning.outputs.sha }}
          submodules: true

      - name: Copy changelogs into res/raw
        run: cp "Updater/changelogs/${{ needs.versioning.outputs.code }}.txt" "ComposeN-Zik/src/androidMain/res/raw/release_notes.txt"

      - name: Setup Java 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Restore Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-dependencies-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-dependencies-${{ runner.os }}-

      - name: Build with Gradle
        run: ./gradlew assembleMinified64 --no-build-cache

      - name: Verify APK source revision and native ABIs
        env:
          SOURCE_SHA: ${{ needs.versioning.outputs.sha }}
        run: python3 .github/scripts/verify_release.py apk --sha "$SOURCE_SHA" --variant minified64 --directory ComposeN-Zik/build/outputs/apk/minified64

      - name: Upload artifacts for signing
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-minified64
          path: ComposeN-Zik/build/outputs/apk/minified64/*.apk

  build-minified32:
    needs: [versioning, verify-version]
    name: Build minified32 version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versioning.outputs.sha }}
          submodules: true

      - name: Copy changelogs into res/raw
        run: cp "Updater/changelogs/${{ needs.versioning.outputs.code }}.txt" "ComposeN-Zik/src/androidMain/res/raw/release_notes.txt"

      - name: Setup Java 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Restore Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-dependencies-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-dependencies-${{ runner.os }}-

      - name: Build with Gradle
        run: ./gradlew assembleMinified32 --no-build-cache

      - name: Verify APK source revision and native ABIs
        env:
          SOURCE_SHA: ${{ needs.versioning.outputs.sha }}
        run: python3 .github/scripts/verify_release.py apk --sha "$SOURCE_SHA" --variant minified32 --directory ComposeN-Zik/build/outputs/apk/minified32

      - name: Upload artifacts for signing
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-minified32
          path: ComposeN-Zik/build/outputs/apk/minified32/*.apk

  build-foss:
    needs: [versioning, verify-version]
    name: Build foss version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versioning.outputs.sha }}
          submodules: true

      - name: Copy changelogs into res/raw
        run: cp "Updater/changelogs/${{ needs.versioning.outputs.code }}.txt" "ComposeN-Zik/src/androidMain/res/raw/release_notes.txt"

      - name: Setup Java 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Restore Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-dependencies-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-dependencies-${{ runner.os }}-

      - name: Build with Gradle
        run: ./gradlew assembleFoss --no-build-cache

      - name: Verify APK source revision and native ABIs
        env:
          SOURCE_SHA: ${{ needs.versioning.outputs.sha }}
        run: python3 .github/scripts/verify_release.py apk --sha "$SOURCE_SHA" --variant foss --directory ComposeN-Zik/build/outputs/apk/foss

      - name: Upload artifacts for signing
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-foss
          path: ComposeN-Zik/build/outputs/apk/foss/*.apk

  sign-apks:
    name: Sign all built APKs
    needs:
      - build-release64
      - build-release32
      - build-minified64
      - build-minified32
      - build-foss
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: upstream/unsigned
          merge-multiple: true

      - name: Sign APKs
        uses: Tlaster/android-sign@v1.2.2
        with:
          releaseDirectory: upstream/unsigned
          signingKeyBase64: "${{ secrets.RELEASE_KEYSTORE }}"
          keyStorePassword: "${{ secrets.RELEASE_KEYSTORE_PASSWD }}"
          alias: "${{ secrets.RELEASE_KEY_ALIAS }}"
          keyPassword: "${{ secrets.RELEASE_KEY_PASSWD }}"
          output: signed
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Remove trails
        run: |
          for filename in signed/*.apk; do mv "$filename" "${filename//-signed}"; done

      - name: Upload for release
        uses: actions/upload-artifact@v7
        with:
          name: signed-apks
          path: signed/*.apk

  upload-to-release:
    needs: [build_time, versioning, sign-apks]
    runs-on: ubuntu-latest
    permissions:
      contents: write  
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versioning.outputs.sha }}
      - name: Reject an existing release tag at a different revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.versioning.outputs.downstream }}
          SOURCE_SHA: ${{ needs.versioning.outputs.sha }}
        run: python3 .github/scripts/verify_release.py tag --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
      - name: Download signed APKs
        uses: actions/download-artifact@v8.0.2
        with:
          name: signed-apks
      - name: Duplicate minified64 asset under its compatibility alias
        run: |
          shopt -s nullglob globstar
          for apk in **/N-Zik-minified64.apk; do cp "$apk" "${apk/N-Zik-minified64/N-Zik-minified}"; done
      - name: Upload built APK to release
        uses: softprops/action-gh-release@v3
        with:
          files: '*.apk'
          name: v${{ needs.versioning.outputs.downstream }}-${{ needs.build_time.outputs.date }} | 🛡️ STABLE Build
          tag_name: v${{ needs.versioning.outputs.downstream }}
          target_commitish: ${{ needs.versioning.outputs.sha }}
          make_latest: true
          body: |
            ## ✨ What's New in v${{ needs.versioning.outputs.downstream }}
            ---
            <div align="center">
              <img alt="N-Zik Logo" src="https://github.com/N-Zik-Group/N-Zik/blob/main/assets/design/ic_banner2.png?raw=true" width="1000" />
              <p><b>N-Zik</b> - by @NEVARLeVrai</p>
            </div>
            
            ## 🔎 Verification
            
            > Always check for signature before installing any app you downloaded from GitHub or other APK distributors.
            
            ### Public key hashes
            
            | Algorithm | Hash digest                                                        |
            |-----------|--------------------------------------------------------------------|
            | SHA-256   | 504cdeb65e52070f0515f9ad295a288a4894d0924e9ef5d6080fdea5bdf841d6 |
            | SHA-1     | 16e766c566e511c7d83f40e30850be27b7040a43                           |
            | MD5       | 16e2bdf083316967c6a2dd5a0391bb76                                   |
            
            ### Certificate hashes
            
            | Algorithm | Hash digest                                                        |
            |-----------|--------------------------------------------------------------------|
            | SHA-256   | b473991ec08a17996a9ef2405934ce35d333ea38135ebfc1b6f4d2ab953132aa |
            | SHA-1     | ec57f7d61cf2382aecff7444e815e37a601cb1f1                           |
            | MD5       | 5ae0045983899ab7ca5db38ef785d6ab                                   |
            
            ## 📲 Installation
             
            1. Download the build matching your device below: **Release64** for 64-bit devices (most devices), **Release32** for 32-bit devices.  
            2. Verify its signature using the hashes provided.  
            3. Install on your device (you may need to allow installation from unknown sources).  
             
            > The **Minified builds** (Minified64 / Minified32) are available for low-end devices. They are R8-shrunk but fully stable.
             
            Please report any crashes, bugs, or unexpected behavior.
             
            ## 📦 Available Builds
             
            - **Release64**: Complete build with all components, 64-bit devices only (arm64-v8a + x86_64, ≈ 57 MB).  
            - **Release32**: Complete build with all components, 32-bit devices only (armeabi-v7a + x86, ≈ 57 MB).  
            - **Minified64**: Lightweight R8-shrunk build, recommended for low-end devices, 64-bit devices only (≈ 28 MB).
            - **Minified32**: Lightweight R8-shrunk build, 32-bit devices only (≈ 28 MB).
            - **FOSS** (`com.nevar.nzik.foss`): Complete build without auto-updater (universal APK, runs on every architecture, ≈ 57 MB).

            ## 🔄 Update Policy
            
            - 🟢 **Release64 & Release32 Builds (-r64 / -r32)** 
            - **Default:** Update notifications for **Stable** are **enabled by default**.  
              - **User options:** - You can **disable Stable updates** in **Settings > About > Auto update enabled**.  
                - You can **enable Beta updates** in **Settings > About > Beta update enabled** to test Beta releases.  
              - **Behavior:** - Without Beta enabled → receives **Stable** updates only.  
                - With Beta enabled → receives both **Stable + Beta** updates.
                
            - 🔵 **Minified64 & Minified32 Builds (-m64 / -m32)** 
            - **Default:** Update notifications for **Stable** are **enabled by default**.  
              - **User options:** - You can **disable Stable updates** in **Settings > About > Auto update enabled**.  
                - Always updates to the corresponding **Release Stable Build**.  
                - No Beta option available.

            - 🟣 **FOSS Build (`com.nevar.nzik.foss`)**
            - **Default:** Auto-update is **disabled** and cannot be enabled.
              - Distributed through alternative stores (F-Droid, IzzyOnDroid, Accrescent, etc.), so updates are handled by the store itself, not the in-app updater.
                
            This lets you decide whether to test new experimental updates or stick with the stable ones.
            
            ## 🔗 Changelog & Downloads
            
            - Full changelog: [Compare v${{ needs.versioning.outputs.upstream }}...v${{ needs.versioning.outputs.downstream }}](https://github.com/N-Zik-Group/N-Zik/compare/v${{ needs.versioning.outputs.upstream }}...v${{ needs.versioning.outputs.downstream }})  
            - [Changelog text file](https://github.com/N-Zik-Group/N-Zik/blob/main/Updater/changelogs/${{ needs.versioning.outputs.code }}.txt)

          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          
  close-issues: 
    needs: [upload-to-release, versioning]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issues marked as "patched STABLE"
        uses: gcampbell-msft/fixed-pending-release@0.0.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          label: patched STABLE
          message: |
            🎉 This issue has been fixed and is now available in **v${{ needs.versioning.outputs.downstream }}** 🎉
            ➤ Download: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.versioning.outputs.downstream }}
            This ticket is now closed. If you have any questions, feel free to reply below.
            If needed, the ticket will be reopened for further support.
      - name: Close issues marked as "implemented"
        uses: gcampbell-msft/fixed-pending-release@0.0.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          label: implemented
          message: |
            ✔️ This feature is now implemented in the app. Therefore, this ticket is closed.
            If you have any question, feel free to reply below.
            The ticket will be reopened if needed.

  notify-discord:
    needs: [upload-to-release, versioning]
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Stable Release Notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONTENT: |
            ✨ **||<@&1345079801324634195>|| NEW STABLE RELEASE v${{ needs.versioning.outputs.downstream }}!**
            
            🚀 Download now!
          DESCRIPTION: |
            ## 📲 Installation
             
            1. Download the build matching your device below: **Release64** for 64-bit devices (most devices), **Release32** for 32-bit devices.  
            2. Verify its signature using the hashes provided.  
            3. Install on your device (you may need to allow installation from unknown sources).  
             
            > The **Minified builds** (Minified64 / Minified32) are available for low-end devices. They are R8-shrunk but fully stable.
             
            Please report any crashes, bugs, or unexpected behavior.
             
            ## 📦 Available Builds
             
            - **Release64**: Complete build with all components, 64-bit devices only (arm64-v8a + x86_64, ≈ 57 MB).  
            - **Release32**: Complete build with all components, 32-bit devices only (armeabi-v7a + x86, ≈ 57 MB).  
            - **Minified64**: Lightweight R8-shrunk build, recommended for low-end devices, 64-bit devices only (≈ 28 MB).
            - **Minified32**: Lightweight R8-shrunk build, 32-bit devices only (≈ 28 MB).
            - **FOSS** (`com.nevar.nzik.foss`): Complete build without auto-updater (universal APK, runs on every architecture, ≈ 57 MB).

            ## 🔄 Update Policy

            - 🟢 **Release64 & Release32 Builds (-r64 / -r32)** - **Default:** Update notifications for **Stable** are **enabled by default**.  
              - **User options:** - You can **disable Stable updates** in **Settings > About > Auto update enabled**.  
                - You can **enable Beta updates** in **Settings > About > Beta update enabled** to test Beta releases.  
              - **Behavior:** - Without Beta enabled → receives **Stable** updates only.  
                - With Beta enabled → receives both **Stable + Beta** updates.
                    
            - 🔵 **Minified64 & Minified32 Builds (-m64 / -m32)** - **Default:** Update notifications for **Stable** are **enabled by default**.  
              - **User options:** - You can **disable Stable updates** in **Settings > About > Auto update enabled**.  
                - Always updates to the corresponding **Release Stable Build**.  
                - No Beta option available.

            - 🟣 **FOSS Build (`com.nevar.nzik.foss`)** - Auto-update is **off by default and can't be enabled**, since store updates (F-Droid, IzzyOnDroid, Accrescent...) handle it instead.
                
            This lets you decide whether to test new experimental updates or stick with the stable ones.

            ## 🔗 Changelog & Downloads

            - 📥 **Release64 APK:** https://github.com/${{ github.repository }}/releases/download/v${{ needs.versioning.outputs.downstream }}/N-Zik-release64.apk
            - 📥 **Release32 APK:** https://github.com/${{ github.repository }}/releases/download/v${{ needs.versioning.outputs.downstream }}/N-Zik-release32.apk
            - 📥 **Minified64 APK:** https://github.com/${{ github.repository }}/releases/download/v${{ needs.versioning.outputs.downstream }}/N-Zik-minified64.apk
            - 📥 **Minified32 APK:** https://github.com/${{ github.repository }}/releases/download/v${{ needs.versioning.outputs.downstream }}/N-Zik-minified32.apk
            - 📥 **FOSS APK:** https://github.com/${{ github.repository }}/releases/download/v${{ needs.versioning.outputs.downstream }}/N-Zik-foss.apk
            - 📄 **Changelog:** <https://github.com/N-Zik-Group/N-Zik/blob/main/Updater/changelogs/${{ needs.versioning.outputs.code }}.txt>
            - 🚀 **Release page:** <https://github.com/${{ github.repository }}/releases/tag/v${{ needs.versioning.outputs.downstream }}>
        run: |
          jq -n \
            --arg content "$CONTENT" \
            --arg username "N-Zik Stable" \
            --arg avatar "https://raw.githubusercontent.com/N-Zik-Group/N-Zik/main/assets/discord/fallback_app.png" \
            --arg desc "$DESCRIPTION" \
            '{
              content: $content,
              username: $username,
              avatar_url: $avatar,
              embeds: [{
                color: 13632401,
                description: $desc,
                footer: {
                  text: "N-Zik Stable • Made by the community, for the community",
                  icon_url: $avatar
                }
              }]
            }' > payload.json
          
          curl -X POST -H "Content-Type: application/json" -d @payload.json $WEBHOOK_URL
