name: Add labels

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  label-build-type:
    runs-on: ubuntu-latest
    steps:
      - name: Detect build type and apply label
        uses: actions/github-script@v9
        with:
          script: |
            const buildTypeLabels = [
              "release64", "release32", "minified64", "minified32",
              "beta64", "beta32", "foss", "dev64", "dev32"
            ];

            const knownBuildLabels = new Set(buildTypeLabels);

            function detectLabel(body) {
              const match = (body || "").match(/^###[ \t]+(?:🏗\uFE0F?[ \t]*)?Build Type[ \t]*\r?\n(?:[ \t]*\r?\n)*([^\r\n]+)/mi);
              if (!match) return null;
              const value = match[1].trim().match(/^([a-z0-9]+)(?:[ \t]+\([^()\r\n]*\))?$/i);
              if (!value) return null;
              const name = value[1].toLowerCase();
              return buildTypeLabels.includes(name) ? name : null;
            }

            async function applyLabel(issueNumber, body) {
              const label = detectLabel(body);
              if (!label) {
                console.log(`Issue #${issueNumber}: no matching Build Type, skipping.`);
                return;
              }

              const currentLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              });

              const already = currentLabels.some((l) => l.name.toLowerCase() === label);

              if (!already) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [label],
                });
              }

              for (const l of currentLabels) {
                const name = l.name.toLowerCase();
                if (knownBuildLabels.has(name) && name !== label) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      name: l.name,
                    });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
              }

              console.log(`Issue #${issueNumber}: labeled "${label}".`);
            }

            if (context.eventName === "workflow_dispatch") {
              // Include closed issues when backfilling historical forms.
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "all",
                per_page: 100,
              });

              for (const issue of issues) {
                if (issue.pull_request) continue;
                await applyLabel(issue.number, issue.body);
              }
            } else if (!context.payload.issue.pull_request) {
              await applyLabel(context.issue.number, context.payload.issue.body);
            }
