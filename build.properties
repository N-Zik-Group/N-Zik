# Build-time API keys for public builds (GitHub releases and F-Droid).
#
# These values are intentionally committed and public:
# - F-Droid builds from the tagged source without environment variables, so the
#   values must live in the source for the build to be reproducible
#   (official F-Droid practice, see https://f-droid.org/en/docs/Inclusion_Policy/).
# - The same values are embedded in every released APK anyway, so committing
#   them exposes nothing new.
#
# Keep in sync with the LASTFM_API_KEY / LASTFM_API_SECRET GitHub secrets.
# A dev machine can override or disable these via local.properties
# (local.properties always wins over this file).
#
# shazam_proxy_api_key: kept out on purpose until a dedicated proxy key is
# available; public builds ship it empty.

