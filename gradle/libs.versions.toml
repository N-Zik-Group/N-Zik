[plugins]
# Multiplatform
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

# Android
android-application = { id = "com.android.application", version.ref = "agp" }
room = { id = "androidx.room", version.ref = "room" }

# Others
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "kotlin-ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"}
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"}
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[bundles]
ktor = ["ktor-core", "ktor-okhttp", "ktor-content-negotiation", "ktor-encoding", "ktor-serialization", "ktor-serialization-json", "ktor-serialization-kotlinx-xml", "ktor-serialization-kotlinx-protobuf"]
junit5 = ["junit5-jupiter-api", "junit5-jupiter-engine", "junit5-jupiter-params"]